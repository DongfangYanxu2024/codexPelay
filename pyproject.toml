[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codepp"
version = "0.3.0"
description = "A local-first reasoning orchestration layer for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Code++ contributors" }]
dependencies = ["pyperclip>=1.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
codepp = "codepp.cli:main"

[tool.setuptools.packages.find]
include = ["codepp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
